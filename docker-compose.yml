# NOT tested or run as part of scaffolding this project. This is a
# starting point for local development once the app is wired up and
# verified to run.
version: "3.9"

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://progressnote:progressnote@db:5432/progressnote
      PROGRESSNOTE_API_KEYS: dev-local-key
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: progressnote
      POSTGRES_PASSWORD: progressnote
      POSTGRES_DB: progressnote
    ports:
      - "5432:5432"
    volumes:
      - progressnote_pgdata:/var/lib/postgresql/data

volumes:
  progressnote_pgdata:
